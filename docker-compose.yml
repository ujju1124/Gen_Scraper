services:
  postgres:
    image: postgres:15
    mem_limit: 400m
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - scraper_network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - scraper_network

  migrator:
    build: ./backend
    command: sh -c "alembic upgrade head && python seed.py"
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://scraper:scraper_pass@postgres:5432/scraper_db
    restart: "no"
    networks:
      - scraper_network

  backend:
    build: ./backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    depends_on:
      migrator:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 400m
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 400M
    env_file: .env
    environment:
      DATABASE_URL: postgresql://scraper:scraper_pass@postgres:5432/scraper_db
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
    dns:
      - 100.127.255.165
      - 100.127.255.73
      - 8.8.8.8
    networks:
      - scraper_network

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    command: celery -A tasks.scrape_task worker --loglevel=info --concurrency=4 --max-tasks-per-child=1
    depends_on:
      migrator:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    shm_size: "512mb"
    mem_limit: 6000m
    memswap_limit: 6000m
    deploy:
      resources:
        limits:
          cpus: '6.0'
          memory: 6000M
        reservations:
          cpus: '3.0'
          memory: 3000M
    env_file: .env
    environment:
      DATABASE_URL: postgresql://scraper:scraper_pass@postgres:5432/scraper_db
      REDIS_URL: redis://redis:6379/0
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      # Memory optimization flags
      NODE_OPTIONS: "--max-old-space-size=512"
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./backend:/app
    dns:
      - 100.127.255.165
      - 100.127.255.73
      - 8.8.8.8
    networks:
      - scraper_network

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    command: celery -A tasks.scrape_task beat --loglevel=info
    depends_on:
      migrator:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 256m
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    env_file: .env
    environment:
      DATABASE_URL: postgresql://scraper:scraper_pass@postgres:5432/scraper_db
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
    networks:
      - scraper_network

  go_scraper_1:
    container_name: go_scraper_1
    build:
      context: ./google-maps-scraper
      dockerfile: Dockerfile
    command: ["google-maps-scraper", "-web", "-addr", ":8080", "-data-folder", "/webdata", "-c", "4"]
    ports:
      - "8080:8080"
    restart: unless-stopped
    mem_limit: 1200m
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1200M
    volumes:
      - go_scraper_data_1:/webdata
    healthcheck:
      test: ["CMD-SHELL", "pidof google-maps-scraper || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - scraper_network

  go_scraper_2:
    container_name: go_scraper_2
    build:
      context: ./google-maps-scraper
      dockerfile: Dockerfile
    command: ["google-maps-scraper", "-web", "-addr", ":8080", "-data-folder", "/webdata", "-c", "4"]
    ports:
      - "8081:8080"
    restart: unless-stopped
    mem_limit: 1200m
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1200M
    volumes:
      - go_scraper_data_2:/webdata
    healthcheck:
      test: ["CMD-SHELL", "pidof google-maps-scraper || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - scraper_network

  go_scraper_3:
    container_name: go_scraper_3
    build:
      context: ./google-maps-scraper
      dockerfile: Dockerfile
    command: ["google-maps-scraper", "-web", "-addr", ":8080", "-data-folder", "/webdata", "-c", "4"]
    ports:
      - "8082:8080"
    restart: unless-stopped
    mem_limit: 1200m
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1200M
    volumes:
      - go_scraper_data_3:/webdata
    healthcheck:
      test: ["CMD-SHELL", "pidof google-maps-scraper || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - scraper_network

  go_scraper_4:
    container_name: go_scraper_4
    build:
      context: ./google-maps-scraper
      dockerfile: Dockerfile
    command: ["google-maps-scraper", "-web", "-addr", ":8080", "-data-folder", "/webdata", "-c", "4"]
    ports:
      - "8083:8080"
    restart: unless-stopped
    mem_limit: 1200m
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1200M
    volumes:
      - go_scraper_data_4:/webdata
    healthcheck:
      test: ["CMD-SHELL", "pidof google-maps-scraper || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - scraper_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    mem_limit: 256m
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
    environment:
      # Environment variables for nginx runtime (if needed)
      - NGINX_HOST=localhost
      - NGINX_PORT=80
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - scraper_network

  pgadmin:
    image: dpage/pgadmin4:8.14
    environment:
      PGADMIN_DEFAULT_EMAIL: "pgadmin@pgadmin.com"
      PGADMIN_DEFAULT_PASSWORD: "pgadmin"
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "False"
      PGADMIN_CONFIG_WTF_CSRF_ENABLED: "False"
    ports:
      - "5050:80"
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - scraper_network

volumes:
  postgres_data:
  go_scraper_data_1:
  go_scraper_data_2:
  go_scraper_data_3:
  go_scraper_data_4:

networks:
  scraper_network:
    driver: bridge
